name: Build Windows Wheels

on:
  workflow_dispatch:

  push:
    branches:
      - probability
    tags:
      - "v*"

  pull_request:
    branches:
      - probability

jobs:
  build-windows:
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA Toolkit
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://developer.download.nvidia.com/compute/cuda/13.3.0/network_installers/cuda_13.3.0_windows_network.exe" `
            -OutFile "$env:TEMP\cuda_installer.exe"

          Start-Process `
            -FilePath "$env:TEMP\cuda_installer.exe" `
            -ArgumentList "-s" `
            -Wait `
            -NoNewWindow

      - name: Setup CUDA environment
        shell: powershell
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"

          if (!(Test-Path "$cudaPath\bin\nvcc.exe")) {
            Write-Error "CUDA installation not found at $cudaPath"
            exit 1
          }

          echo "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV
          echo "CUDA_HOME=$cudaPath" >> $env:GITHUB_ENV
          echo "CUDAToolkit_ROOT=$cudaPath" >> $env:GITHUB_ENV
          echo "CudaToolkitDir=$cudaPath\" >> $env:GITHUB_ENV
          echo "$cudaPath\bin" >> $env:GITHUB_PATH

      - name: Verify CUDA
        shell: powershell
        run: |
          nvcc --version
          where.exe nvcc

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build scikit-build-core pybind11 wheel twine

      - name: Build wheel
        run: |
          python -m build

      - name: Check distributions
        run: |
          python -m twine check dist/*

      - name: List distributions
        shell: powershell
        run: |
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheels-python-${{ matrix.python-version }}
          path: dist/*
