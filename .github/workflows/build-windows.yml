name: Build Windows Wheel

on:
  push:
    branches:
      - probability
  pull_request:
    branches:
      - probability

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CUDA Toolkit
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://developer.download.nvidia.com/compute/cuda/13.3.0/network_installers/cuda_13.3.0_windows_network.exe" `
            -OutFile "$env:TEMP\cuda_installer.exe"

          Start-Process `
            -FilePath "$env:TEMP\cuda_installer.exe" `
            -ArgumentList "-s" `
            -Wait `
            -NoNewWindow

      - name: Setup CUDA environment
        shell: powershell
        run: |
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"

          echo "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV
          echo "$cudaPath\bin" >> $env:GITHUB_PATH

      - name: Verify CUDA
        shell: powershell
        run: |
          nvcc --version
          where.exe nvcc

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build scikit-build-core pybind11 wheel twine

      - name: Build wheel
        run: |
          python -m build

      - name: Check distributions
        run: |
          python -m twine check dist/*

      - name: List distributions
        shell: powershell
        run: |
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheels
          path: dist/*
