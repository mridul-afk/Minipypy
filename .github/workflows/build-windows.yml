name: Build Windows Wheel

on:
  push:
    branches:
      - probability
  pull_request:
    branches:
      - probability

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "13.3.1"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build scikit-build-core pybind11 wheel twine

      - name: Verify CUDA
        run: |
          nvcc --version
          where nvcc

      - name: Build wheel
        run: |
          python -m build

      - name: Check distributions
        run: |
          python -m twine check dist/*

      - name: List distributions
        run: |
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheels
          path: dist/*
