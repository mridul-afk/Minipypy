name: Build Linux Wheel

on:
  push:
    branches:
      - probability
  pull_request:
    branches:
      - probability

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    container:
      image: nvidia/cuda:13.3.1-devel-ubuntu24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            python3.12 \
            python3.12-venv \
            python3.12-dev \
            python3-pip \
            build-essential \
            git

      - name: Setup Python environment
        run: |
          python3.12 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/python -m pip install \
            build \
            scikit-build-core \
            pybind11 \
            wheel \
            twine

      - name: Verify Python
        run: |
          /tmp/venv/bin/python --version
          /tmp/venv/bin/python -c "import sys; print(sys.executable)"

      - name: Verify CUDA
        run: |
          nvcc --version
          which nvcc

      - name: Build wheel
        run: |
          /tmp/venv/bin/python -m build

      - name: Check distributions
        run: |
          /tmp/venv/bin/python -m twine check dist/*

      - name: List distributions
        run: |
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheels
          path: dist/*
